<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M3Play</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<div class="nav">
  <div class="logo">
    <img src="icon.png">
    <h3>M3Play</h3>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <h1>Minimal Music Player</h1>
  <p>Clean, smooth and premium music experience</p>

  <div class="buttons">
    <button class="btn primary" onclick="download()">Download APK</button>
    <button class="btn secondary" onclick="github()">GitHub</button>
  </div>

  <!-- COUNTER -->
  <div class="stats">
    <div>
      <h2 id="downloads">0</h2>
      <p>Downloads</p>
    </div>
    <div>
      <h2>4.9★</h2>
      <p>Rating</p>
    </div>
  </div>
</div>

<!-- SCREENSHOTS -->
<section class="screens">
  <h2>App Preview</h2>

  <div class="slider" id="slider">
    <img src="ss1.jpg">
    <img src="ss2.jpg">
    <img src="ss3.jpg">
    <img src="ss4.jpg">
  </div>
</section>

<!-- IPHONE MOCKUP -->
<section class="phone-section">
  <h2>Experience M3Play</h2>

  <div class="phone">
    <img src="ss2.jpg" class="screen">
  </div>
</section>

<!-- FOOTER -->
<div class="footer">
  Made with ❤️ by JAY
</div>

<script src="script.js"></script>

</body>
</html>
